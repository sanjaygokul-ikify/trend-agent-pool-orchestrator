[tool.poetry]
name = "agent-pool-orchestrator"
version = "0.1.0"
description = "Distributed agent orchestration framework"
authors = ["AI Architect <contact@example.com>"]
license = "MIT"
packages = [{include = "agent_pool"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.68.0"
sanic = "^22.9.0"
h3ron = "^2.0.3"
